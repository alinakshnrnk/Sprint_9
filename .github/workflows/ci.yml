name: Tests CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  run-tests:
    name: Run Selenium Tests via Selenoid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Selenoid Chrome image
        run: docker pull selenoid/vnc_chrome:126.0

      - name: Start services and run tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
